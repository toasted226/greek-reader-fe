<div class="flex items-start gap-4 px-6 pt-6">
  <span class="flex size-11 shrink-0 items-center justify-center rounded-xl bg-red-100 text-red-700" aria-hidden="true">
    <mat-icon>warning_amber</mat-icon>
  </span>
  <div class="min-w-0">
    <h2
      mat-dialog-title
      id="delete-account-dialog-title"
      class="!m-0 !p-0 text-lg font-semibold tracking-tight text-text-primary"
    >
      Delete your account?
    </h2>
    <p id="delete-account-dialog-description" class="mt-2 text-sm leading-6 text-text-secondary">
      Your account and all associated data will be permanently deleted. This action cannot be undone.
    </p>
  </div>
</div>

<div mat-dialog-actions class="!m-0 !min-h-0 !justify-end gap-2 !px-6 !pb-6 !pt-6">
  <button
    type="button"
    (click)="cancel()"
    class="inline-flex h-10 cursor-pointer items-center justify-center rounded-xl border border-border-default bg-white px-4 text-sm font-medium text-text-secondary transition-colors hover:bg-surface-page focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-primary focus-visible:ring-offset-2"
  >
    Cancel
  </button>
  <button
    type="button"
    (click)="confirm()"
    class="inline-flex h-10 cursor-pointer items-center justify-center gap-2 rounded-xl bg-red-600 px-4 text-sm font-semibold text-white shadow-xs transition-colors hover:bg-red-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500 focus-visible:ring-offset-2"
  >
    <mat-icon class="text-[20px]!">delete</mat-icon>
    <span>Delete account</span>
  </button>
</div>
