<main class="flex flex-col gap-6">
  <header>
    <h1 class="text-[30px] font-bold leading-9.5 text-text-primary">Settings</h1>
    <span class="text-[15px] leading-5.5 text-text-secondary">Configure settings or manage your profile</span>
  </header>

  <section class="rounded-xl border border-border-default bg-surface-card p-6 text-text-secondary w-128">
    <div class="mb-8">
      <h2 class="text-[22px] font-semibold leading-7.5 text-text-primary mb-2">Delete your account</h2>
      <span class="text-[15px] leading-5.5 text-text-secondary">Deleting your account will permanently delete all of your data from our servers. This action cannot be undone.</span>
    </div>

    <button
      type="button"
      (click)="deleteAccount()"
      class="w-full py-2.5 px-4 rounded-xl bg-red-500 hover:bg-red-500/90 disabled:opacity-50 disabled:cursor-not-allowed text-text-on-brand font-medium text-sm transition-colors flex items-center justify-center shadow-xs gap-2"
    >
      @if (isLoading()) {
        <span>Deleting...</span>
      } @else {
        <span>Delete</span>
      }
    </button>
  </section>
</main>
