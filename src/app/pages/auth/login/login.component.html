<div class="min-h-screen w-full flex flex-col items-center justify-center p-4 sm:p-6 bg-surface-page text-text-primary">
  <div class="w-full max-w-md flex flex-col items-center">
    <!-- Greek Reader Logo -->
    <div class="flex items-center gap-2.5 mb-8 select-none">
      <span class="text-brand-primary font-bold text-3xl leading-none">Ω</span>
      <span class="font-bold text-2xl tracking-tight text-text-primary">Greek Reader</span>
    </div>

    <!-- Login Card -->
    <div class="w-full bg-surface-card rounded-2xl p-6 sm:p-8 shadow-xs border border-border-default flex flex-col gap-5">
      <div class="flex flex-col gap-1 text-center sm:text-left">
        <h1 class="text-xl font-semibold text-text-primary">Sign in</h1>
        <p class="text-sm text-text-secondary">Enter your email to receive a sign-in link</p>
      </div>

      <form (submit)="$event.preventDefault(); signIn()" class="flex flex-col gap-4">
        <div class="flex flex-col gap-1.5">
          <label for="email" class="text-sm font-medium text-text-primary">
            Email address
          </label>
          <input
            id="email"
            type="email"
            name="email"
            autocomplete="email"
            required
            placeholder="you@example.com"
            [value]="email()"
            (input)="email.set($any($event.target).value)"
            [disabled]="isLoading()"
            class="w-full h-11 px-3.5 rounded-xl border border-border-default bg-surface-card text-text-primary placeholder:text-text-secondary/60 focus:outline-none focus:ring-2 focus:ring-brand-primary/50 text-sm transition-colors disabled:opacity-60"
          />
        </div>

        <button
          type="submit"
          [disabled]="isLoading() || !email().trim()"
          class="w-full h-11 rounded-xl bg-brand-primary hover:bg-brand-primary/90 disabled:opacity-50 disabled:cursor-not-allowed text-text-on-brand font-medium text-sm transition-colors flex items-center justify-center shadow-xs cursor-pointer"
        >
          @if (isLoading()) {
            <mat-progress-spinner
              mode="indeterminate"
              [diameter]="20"
              aria-label="Sending verification email..."
            />
          } @else {
            <span>Sign in</span>
          }
        </button>

        <p class="text-xs text-text-secondary text-center">
          We <b>only</b> use your email for authentication purposes.<br>
          By signing in you agree to our
          <a routerLink="/privacy" class="text-brand-primary hover:underline font-medium">Privacy Policy</a>.
        </p>
      </form>

      @if (successMessage()) {
        <div
          class="text-sm text-success bg-success-soft border border-success-border rounded-xl p-3 text-center"
          role="status"
        >
          {{ successMessage() }}
        </div>
      }

      @if (errorMessage()) {
        <div
          class="text-sm text-danger bg-danger-soft border border-danger-border rounded-xl p-3 text-center"
          role="alert"
        >
          {{ errorMessage() }}
        </div>
      }
    </div>
  </div>
</div>
