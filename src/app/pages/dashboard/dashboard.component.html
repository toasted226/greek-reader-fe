<div class="flex h-dvh w-screen flex-col overflow-hidden bg-surface-page text-text-primary">
  <mat-toolbar class="bg-surface-card! text-text-primary! border-b border-border-default z-10 flex items-center px-4 shrink-0 shadow-xs">
    <div class="flex items-center gap-2.5 select-none">
      <span class="text-brand-primary font-bold text-2xl leading-none">Ω</span>
      <span class="font-bold text-xl tracking-tight">Greek Reader</span>
    </div>
    <div class="ml-auto flex items-center gap-1">
      <app-theme-toggle />
      <button
        mat-icon-button
        type="button"
        aria-label="Sign out"
        class="md:hidden"
        (click)="signOut()"
        [disabled]="isSigningOut()"
      >
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </mat-toolbar>
  @if (signOutError()) {
    <p class="bg-surface-card px-4 py-2 text-xs text-danger md:hidden" role="alert">{{ signOutError() }}</p>
  }

  <mat-sidenav-container class="flex-1 w-full bg-transparent!">
    <!-- Side navigation content -->
    <mat-sidenav
      #sidenav
      mode="side"
      opened="true"
      class="group hidden! w-60! border-r! border-border-default! bg-surface-card! overflow-x-hidden transition-[width] duration-300 ease-in-out shadow-xs md:block!"
    >
      <div class="flex h-full flex-col">
        <mat-nav-list class="py-2">
          <a mat-list-item routerLink="/dashboard/analyse" routerLinkActive="bg-brand-soft! text-brand-primary!" class="flex items-center text-text-secondary hover:text-text-primary hover:bg-surface-sunken transition-colors">
            <mat-icon matListItemIcon class="text-inherit">menu_book</mat-icon>
            <span class="opacity-100 transition-opacity duration-200 whitespace-nowrap text-sm font-medium">Text Analyser</span>
          </a>
          <a mat-list-item routerLink="/dashboard/file-analyser" routerLinkActive="bg-brand-soft! text-brand-primary!" class="flex items-center text-text-secondary hover:text-text-primary hover:bg-surface-sunken transition-colors">
            <mat-icon matListItemIcon class="text-inherit">upload_file</mat-icon>
            <span class="opacity-100 transition-opacity duration-200 whitespace-nowrap text-sm font-medium">File Analyser</span>
          </a>
          <a mat-list-item routerLink="/dashboard/lemmas" routerLinkActive="bg-brand-soft! text-brand-primary!" class="flex items-center text-text-secondary hover:text-text-primary hover:bg-surface-sunken transition-colors">
            <mat-icon matListItemIcon class="text-inherit">bookmark</mat-icon>
            <span class="opacity-100 transition-opacity duration-200 whitespace-nowrap text-sm font-medium">Saved Words</span>
          </a>
          <a mat-list-item routerLink="/dashboard/settings" routerLinkActive="bg-brand-soft! text-brand-primary!" class="flex items-center text-text-secondary hover:text-text-primary hover:bg-surface-sunken transition-colors">
            <mat-icon matListItemIcon class="text-inherit">settings</mat-icon>
            <span class="opacity-100 transition-opacity duration-200 whitespace-nowrap text-sm font-medium">Settings</span>
          </a>
        </mat-nav-list>

        <div class="mt-auto border-t border-border-default p-2">
          @if (signOutError()) {
            <p class="mb-2 px-2 text-xs text-danger" role="alert">{{ signOutError() }}</p>
          }
          <button
            type="button"
            (click)="signOut()"
            [disabled]="isSigningOut()"
            class="flex h-11 w-full cursor-pointer items-center gap-3 rounded-xl px-4 text-sm font-medium text-text-secondary transition-colors hover:bg-surface-sunken hover:text-text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-primary disabled:opacity-60"
          >
            <mat-icon class="text-inherit">logout</mat-icon>
            <span>{{ isSigningOut() ? 'Signing out…' : 'Sign out' }}</span>
          </button>
        </div>
      </div>
    </mat-sidenav>

    <!-- Main app content -->
    <mat-sidenav-content #sidenavContent class="bg-surface-page! flex flex-col h-full overflow-y-auto">
      <main class="p-6 lg:p-8 flex-1 flex flex-col min-h-0 w-full">
        <!-- Your router-outlet or main page content goes here -->
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>

  <nav
    aria-label="Main navigation"
    class="mobile-bottom-nav flex shrink-0 justify-around border-t border-border-default bg-surface-card px-2 pt-1 pb-[calc(0.25rem_+_env(safe-area-inset-bottom))] shadow-lg md:hidden"
  >
    <a
      mat-button
      routerLink="/dashboard/analyse"
      routerLinkActive="bg-brand-soft!"
      ariaCurrentWhenActive="page"
      class="group min-h-[3.75rem] min-w-0 flex-1 rounded-xl px-0.5 py-1 leading-none !text-text-primary hover:bg-surface-sunken"
    >
      <span class="flex w-full flex-col items-center justify-center gap-0.5">
        <mat-icon class="!m-0 !size-6 !self-center !text-xl !text-text-primary group-aria-[current=page]:!text-brand-primary">menu_book</mat-icon>
        <span class="!mt-1 !text-text-primary text-[0.6875rem] font-medium leading-4">Analyse</span>
      </span>
    </a>
    <a
      mat-button
      routerLink="/dashboard/file-analyser"
      routerLinkActive="bg-brand-soft!"
      ariaCurrentWhenActive="page"
      class="group min-h-[3.75rem] min-w-0 flex-1 rounded-xl px-0.5 py-1 leading-none !text-text-primary hover:bg-surface-sunken"
    >
      <span class="flex w-full flex-col items-center justify-center gap-0.5">
        <mat-icon class="!m-0 !size-6 !self-center !text-xl !text-text-primary group-aria-[current=page]:!text-brand-primary">upload_file</mat-icon>
        <span class="!mt-1 !text-text-primary text-[0.6875rem] font-medium leading-4">Files</span>
      </span>
    </a>
    <a
      mat-button
      routerLink="/dashboard/lemmas"
      routerLinkActive="bg-brand-soft!"
      ariaCurrentWhenActive="page"
      class="group min-h-[3.75rem] min-w-0 flex-1 rounded-xl px-0.5 py-1 leading-none !text-text-primary hover:bg-surface-sunken"
    >
      <span class="flex w-full flex-col items-center justify-center gap-0.5">
        <mat-icon class="!m-0 !size-6 !self-center !text-xl !text-text-primary group-aria-[current=page]:!text-brand-primary">bookmark</mat-icon>
        <span class="!mt-1 !text-text-primary text-[0.6875rem] font-medium leading-4">Saved</span>
      </span>
    </a>
    <a
      mat-button
      routerLink="/dashboard/settings"
      routerLinkActive="bg-brand-soft!"
      ariaCurrentWhenActive="page"
      class="group min-h-[3.75rem] min-w-0 flex-1 rounded-xl px-0.5 py-1 leading-none !text-text-primary hover:bg-surface-sunken"
    >
      <span class="flex w-full flex-col items-center justify-center gap-0.5">
        <mat-icon class="!m-0 !size-6 !self-center !text-xl !text-text-primary group-aria-[current=page]:!text-brand-primary">settings</mat-icon>
        <span class="!mt-1 !text-text-primary text-[0.6875rem] font-medium leading-4">Settings</span>
      </span>
    </a>
  </nav>

  <app-scroll-to-top [target]="sidenavContent" />
</div>
