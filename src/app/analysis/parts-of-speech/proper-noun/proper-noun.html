<table class="w-full">
  <thead>
  <tr>
    <th class="inflection-header">Case</th>
    <th class="inflection-header">Singular</th>
    <th class="inflection-header">Plural</th>
  </tr>
  </thead>
  <tbody>
  @for (grammaticalCase of cases; track grammaticalCase.key) {
    <tr class="inflection-row">
      <td class="inflection-label">{{ grammaticalCase.label }}</td>
      <td class="inflection-value">{{ getForm([grammaticalCase.key, "singular"]) }}</td>
      <td class="inflection-value">{{ getForm([grammaticalCase.key, "plural"]) }}</td>
    </tr>
  }
  </tbody>
</table>
