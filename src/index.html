<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GreekReader</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the stored theme before first paint to avoid a flash of the
      // wrong theme. Keep this in sync with ThemeService (three-state:
      // system / light / dark, defaulting to the OS preference).
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('greek-reader-theme');
        } catch (e) {
          // Storage can be unavailable; fall back to the system preference.
        }

        var systemDark = false;
        try {
          systemDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {
          // matchMedia can be unavailable; default to light until the app boots.
        }

        var dark = stored === 'dark' || (stored !== 'light' && systemDark);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <script src="/runtime-config.js"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
